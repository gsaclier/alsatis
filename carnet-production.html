<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet de production — Alsatis Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7FA;--card:#fff;--ink:#16213A;--muted:#5B6478;--line:#E3E7EF;--accent:#1E3A8A;
--p1:#9DB6EA;--p2:#6E93E3;--p3:#3E63C9;--p4:#1E3A8A;
--ok:#16A34A;--bad:#DC2626;--wc:#7C3AED;--wf:#B7791F;--gr:#94A3B8;}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 Roboto,system-ui,sans-serif;display:flex;flex-direction:column}
h1{font:800 19px Mulish;margin:0}
button,label.btn{font:600 12.5px Mulish;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,label.btn:hover{background:#EEF2FB}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .sub{color:var(--muted);font-size:12px}
.grow{flex:1}
.zgrp{display:flex}.zgrp button{border-radius:0}.zgrp button:first-child{border-radius:8px 0 0 8px}.zgrp button:last-child{border-radius:0 8px 8px 0}.zgrp button+button{border-left:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;padding:12px 18px 4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .v{font:800 20px Mulish}.kpi .l{color:var(--muted);font-size:11.5px;margin-top:1px}
.kpi .s{font-size:11px;color:var(--muted)}
.v.bad{color:var(--bad)}.v.ok{color:var(--ok)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px}
.fbar input[type=search]{flex:1 1 220px;min-width:170px;font:13px Roboto;padding:8px 11px;border:1px solid var(--line);border-radius:8px}
.chip{font:600 11.5px Mulish;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;color:var(--muted)}
.chip.on{color:#fff;border-color:transparent}
.chip .n{opacity:.75;font-weight:400}
.leg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:2px 18px 8px;color:var(--muted);font-size:11.5px}
.leg .sw{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.leg .dia{display:inline-block;width:8px;height:8px;border:1.5px solid var(--accent);background:#fff;transform:rotate(45deg);margin:0 5px 0 1px}
.leg .lt{display:inline-block;width:14px;height:3px;background:var(--bad);border-radius:2px;vertical-align:2px;margin-right:4px}
.gwrap{flex:1;overflow:auto;border-top:1px solid var(--line);background:var(--card)}
.grow-row{display:flex;width:max-content;min-width:100%}
.lab{position:sticky;left:0;z-index:2;flex:0 0 410px;width:410px;min-width:410px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.track{position:relative;border-bottom:1px solid var(--line);flex:0 0 auto}
.ghead{position:sticky;top:0;z-index:3}
.ghead .lab{z-index:4;border-bottom:1px solid var(--line);justify-content:flex-end;font:700 11px Mulish;color:var(--muted)}
.mrow{position:relative;height:24px;border-bottom:1px solid var(--line);background:#F9FAFD}
.mcell{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font:700 11px Mulish;color:var(--muted);padding:4px 6px;white-space:nowrap;overflow:hidden}
.wrow{position:relative;height:18px;background:#F9FAFD}
.wtick{position:absolute;top:0;height:100%;border-left:1px solid #EDF0F7;font:400 10px Roboto;color:#9AA3B5;padding:2px 3px;white-space:nowrap}
.r-aff .lab{cursor:pointer;background:#F7F9FD;border-left:4px solid #C7D2E8;padding-left:10px}
.r-aff{background:#FBFCFE}
.r-aff .lab .t1{display:flex;gap:7px;align-items:center;font:700 13px/1.25 Mulish;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
.open .chev{transform:rotate(90deg)}
.t2{display:flex;gap:5px 7px;align-items:center;color:var(--muted);font-size:11px;line-height:1.25;margin-top:3px;flex-wrap:nowrap;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{font:700 9.5px Mulish;color:#fff;border-radius:4px;padding:1px 5px}
.pill{font:600 10.5px Mulish;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pl-livree{background:#E4F5EA;color:var(--ok)}.pl-en_cours{background:#E7EDFB;color:var(--accent)}
.pl-en_retard{background:#FCE7E7;color:var(--bad)}.pl-attente_client{background:#F1E8FD;color:var(--wc)}
.pl-attente_fournisseur{background:#FAF0DC;color:var(--wf)}.pl-a_demarrer{background:#FCE7E7;color:var(--bad)}
.pl-planifie{background:#EEF1F6;color:var(--muted)}
.pl-retour_commercial{background:#FCE7F3;color:#BE185D}
.r-lig .lab{padding-left:34px;background:#fff}
.r-lig .t1{font:600 12.5px/1.25 Roboto;display:flex;gap:7px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-lig{cursor:pointer}.r-lig .lab::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:1px;background:#E7EBF3}.r-lig .lab::after{content:"";position:absolute;left:20px;top:50%;width:9px;height:1px;background:#E7EBF3}
.r-lig:hover .lab,.r-lig:hover .track{background:#F6F9FF}
.bar{position:absolute;top:12px;height:16px;border-radius:4px}
.seg{position:absolute;top:0;height:100%}
.seg:first-child{border-radius:4px 0 0 4px}.seg.last{border-radius:0 4px 4px 0}
.sv{opacity:.35}
.sw-att{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.75) 0 5px,transparent 5px 10px)}
.abar{position:absolute;top:19px;height:5px;border-radius:3px;background:#D9E1F2}
.dia{position:absolute;top:14px;width:11px;height:11px;transform:rotate(45deg);background:#fff;border:2px solid var(--accent);z-index:1}
.dia.bad{border-color:var(--bad)}.dia.done{border-color:var(--ok);background:var(--ok)}
.late{position:absolute;top:30px;height:3px;background:var(--bad);border-radius:2px}
.tl{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #64748B99;z-index:1}
.h-aff{height:52px}.h-lig{height:50px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.tabs{display:flex;background:#EEF1F7;border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:6px 13px}
.tabs button.on{background:var(--accent);color:#fff}
.fbar select{font:13px Roboto;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.viewbox{flex:1;overflow:auto;border-top:1px solid var(--line);background:var(--card);padding:16px 18px;display:none}
.secttl{font:800 15px Mulish;margin:2px 0 10px}
.note{color:var(--muted);font-size:11.5px;margin:10px 0 0}
.ch-t{border-collapse:collapse;font-size:12.5px}
.ch-t th,.ch-t td{border:1px solid var(--line);padding:6px 9px;text-align:center;white-space:nowrap}
.ch-t th{background:#F1F4FA;font:700 11px Mulish;color:var(--muted)}
.ch-t td:first-child,.ch-t th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.ch-t th:first-child{background:#F1F4FA}
.cl-ok{background:#F2F7F3;color:#256C43}.cl-mid{background:#FBF3DF;color:#8A6116}
.cl-hot{background:#FCE7E7;color:var(--bad);font-weight:700}
.cl-off{color:#B6BECE}.cl-past{opacity:.55}
.fx-bars{display:flex;align-items:flex-end;gap:14px;padding:10px 4px 0;overflow-x:auto}
.fx-col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:80px;cursor:pointer}
.fx-stack{display:flex;flex-direction:column-reverse;width:46px}
.fx-os{background:var(--accent);border-radius:3px 3px 0 0}
.fx-mrr{background:#0D9488;border-radius:0 0 3px 3px}
.fx-col.fut .fx-os,.fx-col.fut .fx-mrr{opacity:.5;outline:1px dashed #94A3B8}
.fx-v{font:700 11.5px Mulish}.fx-l{font-size:11px;color:var(--muted);text-transform:capitalize}
.fx-t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:16px}
.fx-t th,.fx-t td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right}
.fx-t th:first-child,.fx-t td:first-child{text-align:left;text-transform:capitalize}
.fx-t th{font:700 11px Mulish;color:var(--muted);background:#F1F4FA}
.fx-t tr.cl{cursor:pointer}.fx-t tr.cl:hover{background:#F6F9FF}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#274CB0}
.btn-d{color:var(--bad);border-color:#F3C7C7}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px;margin:10px 0}
.fg label{font:600 10.5px Mulish;color:var(--muted);display:block;margin:0 0 3px;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select{width:100%;font:12.5px Roboto;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.fg .full{grid-column:1/-1}
.tchk{display:flex;flex-wrap:wrap;gap:6px 14px;padding:4px 0}
.tchk label{font:400 12.5px Roboto;color:var(--ink);text-transform:none;letter-spacing:0;display:flex;gap:5px;align-items:center;margin:0}
.btnrow{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.capin{width:56px;font:12px Roboto;padding:3px 5px;border:1px solid var(--line);border-radius:6px;text-align:center}
.skb{display:inline-block;font:700 9.5px Mulish;border-radius:4px;padding:1px 5px;margin:3px 3px 0 0;cursor:pointer;color:#fff}
.skb.off{background:#EEF1F6;color:#9AA3B5}
.tchk label.hc{opacity:.5}
.cfg-sec{margin:0 0 26px}
.cfg-t{font:800 13px Mulish;margin:0 0 8px;color:var(--ink)}
.tin{font:12.5px Roboto;padding:5px 7px;border:1px solid var(--line);border-radius:6px;min-width:170px}
.mdur,.mchg{width:66px;font:12px Roboto;padding:3px 5px;border:1px solid var(--line);border-radius:6px;text-align:center}
.mdl{background:#FBFCFE;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.mdl summary{cursor:pointer;font:600 13px Roboto}
.mdl[open] summary{margin-bottom:6px}
.impk{color:var(--bad);font-size:12px}
.impw{color:#8A6116;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16213A;color:#fff;font:600 12.5px Mulish;padding:9px 16px;border-radius:9px;z-index:20;box-shadow:0 6px 20px #16213A44}
.nextstep{font:700 10.5px Mulish;border:1px solid #CBE5D3;border-radius:6px;background:#F2FBF5;color:#15803D;padding:1px 7px;cursor:pointer}
.nextstep:hover{background:#DCF3E3}
.tv{font:700 9px Mulish;border-radius:4px;padding:1px 4px}
.tv-upgrade{background:#E1F0E8;color:#0B6B44}.tv-downgrade{background:#FCE7E7;color:#B42318}
.tv-renouvellement{background:#EEF1F6;color:#5B6478}
.albar{display:flex;flex-wrap:wrap;gap:8px;padding:2px 18px 8px}
.alp{border:0;border-radius:999px;font:700 11.5px Mulish;padding:5px 12px;cursor:pointer}
/* Amélioration de la colonne Affaire / ligne */
.lab .cb{flex:0 0 auto;box-shadow:0 1px 2px rgba(15,34,68,.12)}
.lab .pill,.lab .nextstep,.lab .tv{flex:0 0 auto}
.r-aff:hover .lab{background:#EEF3FB}
.r-lig:hover .lab{background:#F7FAFF}
.r-aff .chev{flex:0 0 auto}


/* Google Drive */
.drive-btn{display:inline-flex;align-items:center;gap:5px;font:600 12px Mulish;border-radius:8px;padding:7px 11px;white-space:nowrap}
.drive-btn.connect{background:#fff;color:#334155;border:1px solid var(--line)}
.drive-btn.save{background:#1a73e8;color:#fff;border-color:#1a73e8}
.drive-btn.load{background:#EEF2FB;color:var(--accent);border-color:#C9D5F0}
.drive-btn svg{width:13px;height:13px;flex-shrink:0}
.save-status{font:700 10.5px Mulish;padding:4px 9px;border-radius:999px;white-space:nowrap}
.save-status.ok{background:#E4F5EA;color:var(--ok)}
.save-status.dirty{background:#FAF0DC;color:#8A6116}
.save-status.none{background:#EEF1F6;color:var(--muted)}
/* panneau */
#ov{position:fixed;inset:0;background:#16213A33;display:none;z-index:8}
#panel{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px #16213A1f;z-index:9;display:none;flex-direction:column}
#panel.on,#ov.on{display:flex}#ov.on{display:block}
#panel header{padding:14px 18px;border-bottom:1px solid var(--line)}
#panel h2{font:800 15px Mulish;margin:0 0 2px}
#panel .body{overflow:auto;padding:12px 18px 24px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px}
.kv .k{color:var(--muted)}
.stp{display:flex;gap:9px;padding:6px 8px;border-radius:8px;align-items:baseline}
.stp.cur{background:#EEF2FB}
.stp .ic{width:16px;text-align:center}
.stp .nm{flex:1}
.stp .dt{color:var(--muted);font-size:11.5px;white-space:nowrap}
.pd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#close{margin-left:auto}
@media(max-width:760px){.lab{flex-basis:340px;width:340px;min-width:340px}.kpis{grid-template-columns:repeat(2,1fr)}.h-aff{height:56px}.h-lig{height:54px}.t2{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>Carnet de production</h1><div class="sub" id="subttl">Ventes → livraison client · C1–C5</div></div>
  <div class="tabs" role="tablist" aria-label="Vue">
    <button data-view="gantt" class="on">Gantt</button><button data-view="charge">Charge équipe</button><button data-view="fact">Facturation</button><button data-view="conf">Réglages</button>
  </div>
  <div class="grow"></div>
  <div class="zgrp" role="group" aria-label="Échelle">
    <button data-z="jour">Jour</button><button data-z="sem">Semaine</button><button data-z="mois" class="on">Mois</button><button data-z="trim">Trimestre</button>
  </div>
  <button id="btoday">Aujourd\u2019hui</button>
  <button id="bfold">Tout replier</button>
  <button id="baff" class="btn-p">+ Affaire</button>
  <button id="bcsv">Import CSV</button>
  <span class="save-status none" id="saveStatus" title="État de sauvegarde">Aucune sauvegarde</span>
  <button class="drive-btn connect" id="btnDriveConnect" onclick="driveAuth()" title="Connecter Google Drive">Connecter Drive</button>
  <button class="drive-btn save" id="btnDriveSave" onclick="driveSave()" style="display:none" title="Sauvegarder sur Google Drive">Sauvegarder Drive</button>
  <button class="drive-btn load" id="btnDriveLoad" onclick="driveLoad()" style="display:none" title="Charger depuis Google Drive">Charger Drive</button>
  <button id="bopen">Ouvrir local…</button>
  <button id="bsave">Enregistrer local</button>
  <button id="bexport">Exporter JSON</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="csvfile" accept=".csv,text/csv" hidden>
</div>
<div class="kpis" id="kpis"></div>
<div class="albar" id="albar" style="display:none"></div>
<div class="fbar">
  <input type="search" id="q" placeholder="Rechercher client, affaire, produit, commercial…" aria-label="Rechercher">
  <select id="ftech" aria-label="Technicien"></select>
  <span id="catchips"></span><span style="width:8px"></span><span id="etatchips"></span>
</div>
<div class="leg" id="leg"></div>
<div class="gwrap" id="gwrap"></div>
<div id="vcharge" class="viewbox"></div>
<div id="vfact" class="viewbox"></div>
<div id="vconf" class="viewbox"></div>
<div id="ov"></div>
<aside id="panel" aria-label="Détail de la ligne"></aside>
<script>
